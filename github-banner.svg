<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d0d0b"/>
      <stop offset="100%" style="stop-color:#111110"/>
    </linearGradient>
    <linearGradient id="redline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c0392b;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#c0392b;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="amberline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4a843;stop-opacity:0"/>
      <stop offset="40%" style="stop-color:#d4a843;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#d4a843;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="rgba(200,196,176,0.04)" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="450" y1="0" x2="450" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="750" y1="0" x2="750" y2="200"/>
  </g>

  <!-- Top classification bar -->
  <rect x="0" y="0" width="900" height="6" fill="#c0392b"/>

  <!-- Bottom classification bar -->
  <rect x="0" y="194" width="900" height="6" fill="#c0392b"/>

  <!-- Left accent line -->
  <rect x="0" y="6" width="3" height="188" fill="url(#redline)"/>

  <!-- Classification text top -->
  <text x="450" y="18" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="6">UNCLASSIFIED // FOR PUBLIC RELEASE // TLP:WHITE</text>

  <!-- Doc label -->
  <text x="48" y="62" font-family="monospace" font-size="9" fill="rgba(200,196,176,0.35)" letter-spacing="3">SUBJECT DOSSIER</text>

  <!-- Main handle -->
  <text x="48" y="118" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#c8c4b0" letter-spacing="-1">Cineeeski</text>

  <!-- Amber underline -->
  <rect x="48" y="126" width="340" height="1" fill="url(#amberline)"/>

  <!-- Role -->
  <text x="48" y="150" font-family="monospace" font-size="11" fill="#5a5850" letter-spacing="3">THREAT INTELLIGENCE ANALYST · RESEARCHER</text>

  <!-- Right side meta block -->
  <g font-family="monospace" font-size="9" fill="rgba(200,196,176,0.25)" letter-spacing="1">
    <text x="820" y="62" text-anchor="end">STATUS</text>
    <text x="820" y="76" text-anchor="end" fill="#d4a843" font-size="10">● ACTIVE</text>
    <text x="820" y="100" text-anchor="end">AVAILABILITY</text>
    <text x="820" y="114" text-anchor="end" fill="rgba(200,196,176,0.5)">FULL REMOTE</text>
    <text x="820" y="138" text-anchor="end">SPECIALIZATION</text>
    <text x="820" y="152" text-anchor="end" fill="rgba(200,196,176,0.5)">CTI · OSINT · FRAUD</text>
  </g>

  <!-- Vertical separator right block -->
  <line x1="740" y1="50" x2="740" y2="170" stroke="rgba(200,196,176,0.08)" stroke-width="1"/>

  <!-- Bottom meta -->
  <text x="48" y="182" font-family="monospace" font-size="8" fill="rgba(200,196,176,0.2)" letter-spacing="2">CTI · THREAT HUNTING · PYTHON TOOLING · DARK WEB · FRAUD ECOSYSTEMS · MITRE ATT&amp;CK</text>
</svg>
